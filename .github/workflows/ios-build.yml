# Builds the iOS app on a macOS runner (public repos get these minutes free).
# The app is not signed: the IPA is for AltStore, which signs it on the user's device.
name: iOS build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Build web app and copy it into the iOS project
        run: |
          npm run build
          npx cap sync ios

      - name: Leave the Filesystem plugin out of the iOS build
        # Its Swift package does not build on the runners (no such module
        # 'IONFilesystemLib'); backups are shared as text on iOS instead.
        run: |
          sed -i '' '/CapacitorFilesystem/d' ios/App/CapApp-SPM/Package.swift
          ! grep -q 'CapacitorFilesystem' ios/App/CapApp-SPM/Package.swift

      - name: Build the app (unsigned)
        working-directory: ios/App
        run: |
          # SWIFT_ENABLE_EXPLICIT_MODULES=NO: Xcode 26 cannot resolve the
          # IONFilesystemLib module of @capacitor/filesystem with explicit modules.
          xcodebuild -project App.xcodeproj -target App -configuration Release \
            -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO build

      - name: Package an unsigned IPA
        run: |
          APP=$(find ios/App/build -name "App.app" -path "*Release-iphoneos*" | head -1)
          test -n "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qr Slate-unsigned.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Slate-unsigned-ipa
          path: Slate-unsigned.ipa
          if-no-files-found: error
